name: Daily AI Short

on:
  workflow_dispatch:

  schedule:
    - cron: "30 6 * * *"


jobs:
  make-short:

    runs-on: ubuntu-latest

    permissions:
      contents: write


    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Get repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts requests

          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ======================================================
      # STORY
      # ======================================================

      - name: Generate unique story
        run: |
          python generate_story.py


      - name: Check story output
        run: |
          echo "Checking story.json..."

          if [ ! -f story.json ]; then
            echo "story.json was not created"
            exit 1
          fi

          ls -lh story.json


      # ======================================================
      # SCENES
      # ======================================================

      - name: Generate visual scenes
        run: |
          python generate_scenes.py


      - name: Check scene output
        run: |
          echo "Checking scenes.json..."

          if [ ! -f scenes.json ]; then
            echo "scenes.json was not created"
            exit 1
          fi

          python - <<'PY'
          import json

          with open(
              "scenes.json",
              "r",
              encoding="utf-8"
          ) as f:
              scenes = json.load(f)

          print("Scene count:", len(scenes))

          if len(scenes) != 8:
              raise SystemExit(
                  f"Expected 8 scenes but got {len(scenes)}"
              )
          PY


      # ======================================================
      # DEBUG STORY + SCENES
      # ======================================================

      - name: Show generated story
        run: |
          cat story.json


      - name: Show scene prompts
        run: |
          cat scenes.json


      # ======================================================
      # NARRATION
      # ======================================================

      - name: Generate narration
        run: |
          python generate_voice.py


      - name: Check narration
        run: |
          echo "Checking narration..."

          if [ ! -f voice.mp3 ]; then
            echo "voice.mp3 was not created"
            exit 1
          fi

          if [ ! -f voice_timing.json ]; then
            echo "voice_timing.json was not created"
            exit 1
          fi

          ls -lh voice.mp3
          ls -lh voice_timing.json

          echo ""
          echo "Narration duration:"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3


      # ======================================================
      # IMAGES
      # ======================================================

      - name: Generate images
        run: |
          rm -rf images
          mkdir -p images

          python generate_images.py


      - name: Check generated images
        run: |
          echo "Generated images:"

          ls -lh images/

          IMAGE_COUNT=$(find images -type f -name "*.jpg" | wc -l)

          echo ""
          echo "Image count: $IMAGE_COUNT"

          if [ "$IMAGE_COUNT" -ne 8 ]; then
            echo "Expected 8 images but found $IMAGE_COUNT"
            exit 1
          fi


      # ======================================================
      # FINAL VIDEO
      # ======================================================

      - name: Create final Short
        run: |
          rm -rf temp_video
          rm -f captions.ass
          rm -f final_short.mp4

          python make_video.py


      - name: Check final Short
        run: |
          echo "Checking final video..."

          if [ ! -f final_short.mp4 ]; then
            echo "final_short.mp4 was not created"
            exit 1
          fi

          ls -lh final_short.mp4

          echo ""
          echo "Video duration:"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            final_short.mp4

          echo ""
          echo "Video properties:"

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width,height,sample_aspect_ratio,display_aspect_ratio \
            -of default=noprint_wrappers=1 \
            final_short.mp4


      # ======================================================
      # UPLOAD ARTIFACTS
      # ======================================================

      - name: Upload final Short
        uses: actions/upload-artifact@v4

        with:
          name: final-short
          path: final_short.mp4
          retention-days: 7


      - name: Upload narration
        uses: actions/upload-artifact@v4

        with:
          name: narration
          path: |
            voice.mp3
            voice_timing.json
          retention-days: 7


      - name: Upload generated images
        uses: actions/upload-artifact@v4

        with:
          name: generated-images
          path: images/
          retention-days: 7


      - name: Upload scene prompts
        uses: actions/upload-artifact@v4

        with:
          name: scene-prompts
          path: scenes.json
          retention-days: 7


      - name: Upload story
        uses: actions/upload-artifact@v4

        with:
          name: generated-story
          path: story.json
          retention-days: 7


      # ======================================================
      # SAVE STORY HISTORY
      # ======================================================

      - name: Save story history
        run: |
          git config user.name "AI Shorts Bot"
          git config user.email "actions@github.com"

          git add story_history.json

          if git diff --cached --quiet; then
            echo "No story history changes to commit"
          else
            git commit -m "Save generated story history"
            git push
          fi