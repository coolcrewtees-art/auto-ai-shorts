name: Daily AI Short


on:

  workflow_dispatch:

  schedule:

    # ======================================================
    # MORNING SHORT
    #
    # 02:00 UTC = 7:30 AM IST
    #
    # Workflow starts at 7:30 AM
    # Video is scheduled for 9:00 AM IST
    # ======================================================

    - cron: "0 2 * * *"


    # ======================================================
    # EVENING SHORT
    #
    # 12:30 UTC = 6:00 PM IST
    #
    # Workflow starts at 6:00 PM
    # Video is scheduled for 7:30 PM IST
    # ======================================================

    - cron: "30 12 * * *"



jobs:

  make-short:

    runs-on: ubuntu-latest


    permissions:

      contents: write


    env:

      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}


      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}

      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}



    steps:


      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Get repository

        uses: actions/checkout@v4



      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip


          pip install \
            kokoro-onnx \
            soundfile \
            requests \
            numpy \
            google-api-python-client \
            google-auth \
            google-auth-httplib2


          sudo apt-get update


          sudo apt-get install -y \
            ffmpeg \
            espeak-ng \
            wget



      # ======================================================
      # KOKORO
      # ======================================================

      - name: Download Kokoro model

        run: |

          wget -q \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx \
            -O kokoro-v1.0.onnx


          wget -q \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin \
            -O voices-v1.0.bin


          echo "Kokoro downloaded"


          ls -lh kokoro-v1.0.onnx

          ls -lh voices-v1.0.bin



      # ======================================================
      # CLEAR OLD RUNTIME FILES
      #
      # This prevents an old video from being reused.
      # ======================================================

      - name: Clear previous runtime files

        run: |

          echo "Clearing old runtime files..."


          rm -f story.json

          rm -f scenes.json


          rm -f voice.mp3

          rm -f voice.wav

          rm -f voice_timing.json


          rm -f final_short.mp4

          rm -f captions.ass


          rm -rf images

          rm -rf temp_video

          rm -rf voice_parts


          mkdir -p images


          echo "Runtime cleared"



      # ======================================================
      # STORY
      # ======================================================

      - name: Generate fresh story

        run: |

          echo "Checking generate_story.py..."


          python -m py_compile generate_story.py


          echo "Generating fresh story..."


          python generate_story.py


          echo "Story generation finished"



      - name: Check fresh story

        run: |

          if [ ! -f story.json ]; then

            echo "story.json does not exist"

            exit 1

          fi


          if [ ! -s story.json ]; then

            echo "story.json is empty"

            exit 1

          fi


          echo "Fresh story created"


          cat story.json



      # ======================================================
      # SCENES
      # ======================================================

      - name: Generate visual scenes

        run: |

          echo "Checking generate_scenes.py..."


          python -m py_compile generate_scenes.py


          echo "Generating visual scenes..."


          python generate_scenes.py



      - name: Check scene output

        run: |

          if [ ! -f scenes.json ]; then

            echo "scenes.json missing"

            exit 1

          fi


          python - <<'PY'

          import json


          with open(
              "scenes.json",
              "r",
              encoding="utf-8"
          ) as f:

              scenes = json.load(f)


          print(
              "Scene count:",
              len(scenes)
          )


          if len(scenes) != 8:

              raise SystemExit(
                  f"Expected exactly 8 scenes, got {len(scenes)}"
              )

          PY



      - name: Show scene prompts

        run: |

          cat scenes.json



      # ======================================================
      # NARRATION
      # ======================================================

      - name: Generate narration

        run: |

          rm -rf voice_parts

          rm -f voice.wav

          rm -f voice.mp3

          rm -f voice_timing.json


          echo "Checking generate_voice.py..."


          python -m py_compile generate_voice.py


          echo "Generating narration..."


          python generate_voice.py



      - name: Check narration

        run: |

          if [ ! -f voice.mp3 ]; then

            echo "voice.mp3 missing"

            exit 1

          fi


          if [ ! -s voice.mp3 ]; then

            echo "voice.mp3 is empty"

            exit 1

          fi


          if [ ! -f voice_timing.json ]; then

            echo "voice_timing.json missing"

            exit 1

          fi


          if [ ! -s voice_timing.json ]; then

            echo "voice_timing.json empty"

            exit 1

          fi


          echo "Narration ready"


          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3



      # ======================================================
      # IMAGES
      # ======================================================

      - name: Generate images

        run: |

          rm -rf images


          mkdir -p images


          echo "Checking generate_images.py..."


          python -m py_compile generate_images.py


          echo "Generating 8 images..."


          python generate_images.py



      - name: Check generated images

        run: |

          IMAGE_COUNT=$(

            find images \
              -type f \
              -name "*.jpg" \
              | wc -l

          )


          echo "Generated images: $IMAGE_COUNT"


          if [ "$IMAGE_COUNT" -ne 8 ]; then

            echo "Expected exactly 8 images"

            exit 1

          fi


          ls -lh images/



      # ======================================================
      # FINAL VIDEO
      # ======================================================

      - name: Create final Short

        run: |

          rm -rf temp_video

          rm -f final_short.mp4

          rm -f captions.ass


          echo "Checking make_video.py..."


          python -m py_compile make_video.py


          echo "Creating final video..."


          python make_video.py



      - name: Check final Short

        run: |

          if [ ! -f final_short.mp4 ]; then

            echo "final_short.mp4 missing"

            exit 1

          fi


          if [ ! -s final_short.mp4 ]; then

            echo "final_short.mp4 is empty"

            exit 1

          fi


          echo "Final Short created"


          ls -lh final_short.mp4


          echo "Duration:"


          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            final_short.mp4


          echo "Video properties:"


          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width,height,sample_aspect_ratio,display_aspect_ratio \
            -of default=noprint_wrappers=1 \
            final_short.mp4



      # ======================================================
      # YOUTUBE
      # ======================================================

      - name: Schedule fresh Short on YouTube

        run: |

          echo "Checking YouTube uploader..."


          python -m py_compile upload_youtube.py


          echo "Scheduling fresh Short..."


          python upload_youtube.py



      # ======================================================
      # ARTIFACTS
      # ======================================================

      - name: Upload final Short artifact

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: final-short-${{ github.run_id }}

          path: final_short.mp4

          if-no-files-found: ignore

          retention-days: 7



      - name: Upload narration artifact

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: narration-${{ github.run_id }}

          path: |
            voice.mp3
            voice_timing.json

          if-no-files-found: ignore

          retention-days: 7



      - name: Upload generated images artifact

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: images-${{ github.run_id }}

          path: images/

          if-no-files-found: ignore

          retention-days: 7



      - name: Upload scenes artifact

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: scenes-${{ github.run_id }}

          path: scenes.json

          if-no-files-found: ignore

          retention-days: 7



      - name: Upload story artifact

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: story-${{ github.run_id }}

          path: story.json

          if-no-files-found: ignore

          retention-days: 7



      # ======================================================
      # SAVE HISTORY
      # ======================================================

      - name: Save story and YouTube history

        if: success()

        run: |

          git config \
            user.name \
            "AI Mania Bot"


          git config \
            user.email \
            "actions@github.com"


          if [ -f story_history.json ]; then

            git add story_history.json

          fi


          if [ -f youtube_upload_history.json ]; then

            git add youtube_upload_history.json

          fi


          if git diff --cached --quiet; then

            echo "No history changes"

          else

            git commit \
              -m "Update AI Mania automation history"


            git push

          fi