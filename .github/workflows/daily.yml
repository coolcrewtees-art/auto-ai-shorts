name: Daily AI Short


on:

  workflow_dispatch:

  schedule:

    # 5:30 PM IST every day
    # = 12:00 UTC
    #
    # Video generation begins here.
    # YouTube upload is then scheduled for 8 PM IST.

    - cron: "0 12 * * *"


jobs:

  make-short:

    runs-on: ubuntu-latest


    permissions:

      contents: write


    env:

      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}


      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}

      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}



    steps:


      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Get repository

        uses: actions/checkout@v4



      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install \
            kokoro-onnx \
            soundfile \
            requests \
            numpy \
            google-api-python-client \
            google-auth \
            google-auth-httplib2

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            espeak-ng \
            wget



      # ======================================================
      # KOKORO
      # ======================================================

      - name: Download Kokoro model

        run: |

          wget -q \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx \
            -O kokoro-v1.0.onnx

          wget -q \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin \
            -O voices-v1.0.bin



      # ======================================================
      # CLEAN OLD RUNTIME FILES
      #
      # Critical:
      # prevents stale files from an old run being reused.
      # ======================================================

      - name: Clear previous runtime files

        run: |

          rm -f story.json
          rm -f scenes.json

          rm -f voice.mp3
          rm -f voice.wav
          rm -f voice_timing.json

          rm -f final_short.mp4

          rm -rf images
          rm -rf temp_video
          rm -rf voice_parts

          mkdir -p images



      # ======================================================
      # STORY
      # ======================================================

      - name: Generate fresh story

        run: |

          python -m py_compile generate_story.py

          python generate_story.py


          if [ ! -s story.json ]; then

            echo "Fresh story.json was not created"

            exit 1

          fi



      # ======================================================
      # SCENES
      # ======================================================

      - name: Generate visual scenes

        run: |

          python -m py_compile generate_scenes.py

          python generate_scenes.py



      - name: Check scene output

        run: |

          python - <<'PY'

          import json


          with open(

              "scenes.json",

              "r",

              encoding="utf-8"

          ) as f:

              scenes = json.load(f)


          print(

              "Scene count:",

              len(scenes)

          )


          if len(scenes) != 8:

              raise SystemExit(

                  "Exactly 8 scenes required"

              )

          PY



      - name: Show scene prompts

        run: |

          cat scenes.json



      # ======================================================
      # VOICE
      # ======================================================

      - name: Generate narration

        run: |

          python -m py_compile generate_voice.py

          python generate_voice.py



      - name: Check narration

        run: |

          if [ ! -s voice.mp3 ]; then

            echo "voice.mp3 missing"

            exit 1

          fi


          if [ ! -s voice_timing.json ]; then

            echo "voice_timing.json missing"

            exit 1

          fi



      # ======================================================
      # IMAGES
      # ======================================================

      - name: Generate images

        run: |

          rm -rf images

          mkdir -p images


          python -m py_compile generate_images.py

          python generate_images.py



      - name: Check generated images

        run: |

          IMAGE_COUNT=$(

            find images \
              -type f \
              -name "*.jpg" \
              | wc -l

          )


          echo "Images: $IMAGE_COUNT"


          if [ "$IMAGE_COUNT" -ne 8 ]; then

            echo "Expected exactly 8 images"

            exit 1

          fi



      # ======================================================
      # VIDEO
      # ======================================================

      - name: Create final Short

        run: |

          rm -rf temp_video

          rm -f final_short.mp4


          python -m py_compile make_video.py

          python make_video.py



      - name: Check final Short

        run: |

          if [ ! -s final_short.mp4 ]; then

            echo "Final video missing"

            exit 1

          fi


          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            final_short.mp4



      # ======================================================
      # YOUTUBE
      # ======================================================

      - name: Schedule fresh Short on YouTube

        run: |

          python -m py_compile upload_youtube.py

          python upload_youtube.py



      # ======================================================
      # ARTIFACTS
      # ======================================================

      - name: Upload final Short artifact

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: final-short-${{ github.run_id }}

          path: final_short.mp4

          if-no-files-found: ignore

          retention-days: 7



      - name: Upload scenes artifact

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: scenes-${{ github.run_id }}

          path: scenes.json

          if-no-files-found: ignore

          retention-days: 7



      - name: Upload generated images artifact

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: images-${{ github.run_id }}

          path: images/

          if-no-files-found: ignore

          retention-days: 7



      # ======================================================
      # SAVE HISTORY
      # ======================================================

      - name: Save story and YouTube history

        if: success()

        run: |

          git config \
            user.name \
            "AI Mania Bot"


          git config \
            user.email \
            "actions@github.com"


          git add story_history.json


          if [ -f youtube_upload_history.json ]; then

            git add youtube_upload_history.json

          fi


          if git diff --cached --quiet; then

            echo "Nothing to save"

          else

            git commit \
              -m "Update AI Mania automation history"


            git push

          fi