name: Daily AI Short

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

jobs:
  make-short:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate unique story
        run: python generate_story.py

      - name: Show generated story
        run: cat story.json

      - name: Save story history
        run: |
          git config user.name "AI Shorts Bot"
          git config user.email "actions@github.com"
          git add story_history.json
          git diff --cached --quiet || git commit -m "Save generated story history"
          git push